product_id_prompt: | 
  {__added_context__}

  Analyze the product in the foreground of this image or if multiple products are in the image, analyze the marked, circled, or otherwise designated item.

  1. First, identify any visible text, logos, brand names, model numbers, or UPC/barcodes
  2. Note distinctive physical characteristics (color, size, material, shape)
  3. Determine the product category (e.g., electronics, food, household item)
  4. Remove any product codes, IDS, SKUs, or other extraneous text from the description and query
  5. Avoid domains specific to second hand, craft, or other non-primary retail sites.
  6. For books, query the exact title and author

  Based on this analysis, provide:
  - query: A specific search query using the exact brand name and product name, or if not availble, the most distinctive identifiable features.
  - description: A concise product description (max 10 words)
  - domain: The best retail domain for this product category (use category specific retailers like homedepot.com for tools, bestbuy.com for electronics, etc.)

  Prioritize specificity over generality in your search query. 

