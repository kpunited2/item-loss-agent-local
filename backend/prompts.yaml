  - description: A concise product description (max 10 words)
  - domain: The best retail domain for this product category (use category specific retailers like homedepot.com for tools, bestbuy.com for electronics, etc.)

  Prioritize generality over specificity in your search query. 

url_analysis_prompt: |
  {__added_context__}

  You are selecting the best product search results that match this item for the purpose of purchasing a comparable replacement after a loss due to fire, flood, or other disaster:
  Description: {__product_description__}
  [The uploaded image (if any is provided) shows the actual product]

  Review these search results described by the index, url, and title and evaluate each one with a score (from 1 to 10, with 10 being the best) and validity:
  {__search_results_str__}

  Selection criteria (in order of priority):
  1. URL must be a direct product page (contains /dp/, /product/, /p/, or similar product identifiers)
  2. Product appears to match the image exactly (same brand, model, size)
  3. Primary retailer preferred over marketplace/reseller (avoid eBay, used goods, auction sites)
  4. Size or prominance of marketplace/retailer. Prefer larger retails like walmart or amazon over obscure or boutique ones
  5. Active product listing (avoid discontinued/out-of-stock indicators in URL)
  6. Location of retailer or website. Use US websites only. With product prices in USD
  7. Don't pull links from Wedding Registries
  8. Avoid craft sites like Etsy
  9. Prefer specific retail domains for this product category (prefer category specific retailers like homedepot.com for tools, bestbuy.com for electronics, etc.)
  10. Aovid wholesellers and industrial factory orders.
  11. Mark links that are likely to be spam, scams, or search engine optimization traps as invalid. For example, unrelated domains names, or sketchy sounding sites


  Mark URLs containing: /search, /browse, /category, /s?, /b/, /gp/aw/, /wishlist, /review, other other similar markers as invalid

  Return a list of structured responses according to the schema provided. One element for each provided search result.



product_detail_prompt: | 
  {__added_context__}

  Product description:
  {__product_description__}

  Extract product information from this URL for the described product for the purpose of purchasing a comparable replacement after a loss due to fire, flood, or other disaster:
  {__link_str__}

  For each URL, extract:
  - The canonical/base price (not sale price unless it's the only price shown)
  - The full product name or title as listed
  - Currency: If the currency or price is not in USD, skip the link
  - The category of the item

  Then format the url validity, item category, price, and name information per the output structure.

  If the URL directs to a page with multiple products, like a search result page, select the one closest to the provided description. 
  If a URL is not a valid page or price cannot be determined, indicate the page if invalid.
  If the page does not have any items that provide a reasonable match for the purpose of replacing an item with a comparable or similar one, indicate the page is invalid.
  If multiple variants exist, extract the price for the default/first variant shown.

sanity_check_prompt: |
  {__added_context__}

  You are validating product search results for fire damage insurance claims. A system analyzed an image of a damaged item and returned product information to estimate purchase price.

  Given the following data, determine if the result is VALID or INVALID and provide a reason why according to the response schema:

  INPUT IMAGE DESCRIPTION: {__description__}
  RETURNED PRICE: {__price__}
  RETURNED URL: {__URL__}

  A result is VALID if ALL of the following are true:
  1. The product name/description reasonably matches the input image description (same item type/category)
  2. The price is a realistic replacement cost (typically $1-$10,000 for household items, not $0 or extremely high)
  3. The URL is an actual product page link or search page or content delivery network endpoint for similar items (not "No Product URL Available" or clearly invalid)
  4. The URL appears to be from a legitimate retailer/marketplace

  A result is INVALID if ANY of the following are true:
  1. Product mismatch: returned product is dramatically different from the image description. Ignore differences like package size, size, color, minor functional differences, etc.
  2. Price is $0, missing, or unrealistically high/low for the item type
  3. URL is a placeholder message or clearly broken/invalid
  4. URL leads to a non-retail site or homepage instead of a specific product

audio_item_extraction_prompt: | 
  {__added_context__}

  This audio file contains a dictation of descriptions of items that were lost, stolen, or damaged after a fire in a home.
  Listen and anylyze the audio file for descriptions of items. Extract and transcribe the item descriptions in about ten words or less.
  The intent is to use these descriptions to search the web for comparable products. Make sure the descriptions are suitable for this purpose.
  You may provide extra context or modify the descriptions for clarity or ease of retrieval.
  Ignore extraneous audio or anything not related to the description of lost of damaged items. Use the response format provided.

