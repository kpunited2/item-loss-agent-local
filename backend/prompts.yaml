pdf_receipt_item_extraction_prompt: |

  {__added_context__}
  
  You are assting in totalling the total actual cost of replacing items after a fire or other property loss claim event.
  Analyze the attached receipt, invoice, or proof of purchase.

  For each item or individual product purchased, extract the name, title, or product description. If the name, title, or description is longer than 10 words, summarize it in ten words or less.
  Translate any abbreviations, internal codes, or retailer-specific shorthand in item names into plain language (tens words or less) that clearly identifies the product to someone unfamiliar with that retailer's format.
  Find and extract the actual net purchase price for each item, inclusive of promontions, sales or other discounts. No don't consider gift cards, rewards points, or other forms of payments as a discount.
  If the price cannot be extracted, set it to 0.0
  Determine the best category for the items from those in the response format
  Determine the quantity purchased for this item. Combine duplicated items into one with the correct quantity. 
  Ignore perishable groceries like produce, dairy, or meat as these are not eligible to be counted as actuals. However, non-perisables like canned goods or ingrediants
  Ignore items that have been marked returned or refunded.

  Based on this analysis respond with the respnse format. 

process_added_context_prompt: |
  Review the following context that a user has provided to assist in an AI system helping to identify, catalog, and price items that we lost, damaged, or replaced for a property loss claim.
  Take special note of any information that might narrow down the gender of clothing or related items, the tier of retailer they frequent, and the class of item (budget, standard, high-end, and luxury) they may have purchased.
  Make sure to note that information found directly from any images, receipts, or descriptions should take priority, but this context should be used when there is uncertainty.
  Format this background and the information provided as added context that can be provided to an AI agent that will search for comparable items on the internets based on an image, description, or audio file.
  Respond in up to two paragraphs, depending on the amount of information provided.

  {__raw_context__}

default_added_context: |
  No additional context was provided by the user.
  When searching for comparable items, default to the following assumptions: assume standard, mid-range products from mainstream retailers such as Target, Amazon, Walmart, IKEA, and similar stores.
  For clothing, determine the gender from context if any is indicated by the item description or image.
  Assume items are in average pre-loss condition unless stated otherwise.
  Prefer name-brand products over generic or store-brand equivalents when a specific brand is not identified. Also avoid designer, luxury, or overly expensive items unless specifically indicated.
  If the item category is ambiguous, favor the most common household version of that item.

