services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8257:8257"
    volumes:
      - "${HOME:-${USERPROFILE}}/item_loss_agent_data:/backend/data"
    env_file:
      - ./backend/.env
    environment:
      # Values here take precedence over env_file, so the container always
      # uses the in-container data path regardless of the host .env value.
      - DATA_DIR=/backend/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8257
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped